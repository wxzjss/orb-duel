<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>光球对决</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }   /* v3.0 触屏防滚动/双击缩放 */
  body { display: flex; align-items: center; justify-content: center; }
  #game { background: #000; cursor: crosshair; }
  /* ---- v2.0 DOM overlay（ADR-005） ---- */
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: sans-serif; z-index: 10; }
  .scr { display: none; position: absolute; inset: 0; flex-direction: column;
         align-items: center; justify-content: center; gap: 14px; pointer-events: auto; }
  .scr.on { display: flex; }
  .title { color: #ffe9c4; font-size: 44px; letter-spacing: 8px; margin-bottom: 18px;
           text-shadow: 0 0 18px rgba(255,233,196,.5); }
  .mi { color: #fff; font-size: 24px; padding: 10px 26px; cursor: pointer;
        letter-spacing: 4px; user-select: none; text-align: center; }
  .mi:hover { color: #ffe9c4; text-shadow: 0 0 12px rgba(255,233,196,.6); }
  .mi.dis { opacity: .4; filter: grayscale(1); cursor: not-allowed; }
  .mi.dis:hover { color: #fff; text-shadow: none; }
  .prog { font-size: 13px; letter-spacing: 1px; opacity: .75; margin-top: 4px; line-height: 1.6; }
  #hud { position: fixed; top: 14px; left: 16px; color: rgba(255,255,255,.85);
         font-size: 16px; line-height: 1.7; letter-spacing: 1px; pointer-events: none; display: none; }
  #confirm-text { color: #fff; font-size: 22px; margin-bottom: 8px; letter-spacing: 2px; }
  #result-lines { color: rgba(255,255,255,.8); font-size: 18px; text-align: center;
                  line-height: 1.9; margin-bottom: 10px; }
  #result-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
           background: rgba(255,255,255,.12); color: #fff; padding: 8px 18px;
           font-size: 14px; display: none; pointer-events: none; letter-spacing: 1px; z-index: 20; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0;
          pointer-events: none; transition: opacity .12s linear; z-index: 15; }
  /* ---- v3.0 手机适配（ADR-010 / mobile.md） ---- */
  #portrait-mask { position: fixed; inset: 0; background: #000; z-index: 40; display: none;
                   align-items: center; justify-content: center; color: #ffe9c4;
                   font-size: 26px; letter-spacing: 6px; font-family: sans-serif; }
  #portrait-mask.on { display: flex; }
  #touchui { position: fixed; inset: 0; pointer-events: none; z-index: 12; display: none; font-family: sans-serif; }
  #touchui.on { display: block; }
  .tbtn { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35);
          border: 2px solid rgba(255,255,255,.4); color: #fff; display: flex; align-items: center;
          justify-content: center; font-size: 16px; letter-spacing: 2px; pointer-events: auto; }
  .tbtn.down { background: rgba(255,255,255,.55); }
  #tbtn-atk { left: 1106px; top: 576px; width: 88px; height: 88px; }   /* 圆心 (1150,620) r=44 */
  #tbtn-guard { left: 964px; top: 624px; width: 72px; height: 72px; }  /* 圆心 (1000,660) r=36 */
  #joy-base { position: absolute; width: 120px; height: 120px; border-radius: 50%;
              border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.2); display: none; }
  #joy-knob { position: absolute; width: 44px; height: 44px; border-radius: 50%;
              background: rgba(255,255,255,.45); display: none; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="ui">
  <div class="scr" id="scr-title">
    <div class="title" style="font-size:56px;letter-spacing:14px;">光 球 对 决</div>
    <div style="margin-top:36px;font-size:18px;color:rgba(255,255,255,.75);letter-spacing:4px;">点击屏幕开始</div>
  </div>
  <div class="scr" id="scr-menu">
    <div class="title">光 球 对 决</div>
    <div class="mi" data-act="solo">单机挑战</div>
    <div class="mi" data-act="online">联机对战</div>
    <div class="mi" data-act="self">挑战自我</div>
    <div class="mi" data-act="boss_solo">单机boss</div>
    <div class="mi" data-act="quit">退出游戏</div>
  </div>
  <div class="scr" id="scr-pair">
    <div class="title">配 对 联 机</div>
    <div id="pair-status" style="color:#d9a441;font-size:14px;min-height:22px;letter-spacing:1px;"></div>
    <!-- 模式选择 -->
    <div id="pair-choose">
      <div class="mi" id="pair-as-host">创建房间（你是房主）</div>
      <div class="mi" id="pair-as-guest">加入房间</div>
    </div>
    <!-- 房主侧 -->
    <div id="pair-host" style="display:none;">
      <div class="mi" id="pair-gen">生成邀请码</div>
      <div id="pair-code" style="color:#7fd8e8;font-size:13px;font-family:monospace;max-width:86%;
           margin:8px auto;word-break:break-all;min-height:20px;background:rgba(0,0,0,.35);
           padding:8px;border-radius:6px;display:none;"></div>
      <div class="mi" id="pair-copy" style="display:none;">复制邀请码</div>
      <div style="color:rgba(255,255,255,.6);font-size:13px;margin:6px 0;">把邀请码发给对方，粘贴对方回传的应答码：</div>
      <input id="pair-answer-in" placeholder="粘贴应答码"
             style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 10px;border-radius:6px;width:420px;max-width:80%;font-size:13px;font-family:monospace;">
      <div class="mi" id="pair-confirm">确认应答码</div>
      <div id="pair-peers" style="color:rgba(255,255,255,.75);font-size:14px;margin-top:8px;line-height:1.8;"></div>
      <div class="mi" id="pair-start">开始对局</div>
      <div style="color:rgba(255,255,255,.4);font-size:12px;margin-top:6px;">房主为权威端 · 房主退出即全房结束 · 邀请码请勿公开传播</div>
    </div>

             style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 10px;border-radius:6px;width:420px;max-width:80%;font-size:13px;font-family:monospace;">

      <div style="color:rgba(255,255,255,.6);font-size:13px;margin:10px 0 4px;">你的应答码（回传给房主）：</div>

           margin:4px auto;word-break:break-all;min-height:20px;background:rgba(0,0,0,.35);
           padding:8px;border-radius:6px;display:none;"></div>

      <div id="pair-wait" style="color:rgba(255,255,255,.6);font-size:13px;display:none;">等待房主确认…</div>

  <div class="scr" id="scr-result">
    <div class="title" id="result-title"></div>

  <div class="scr" id="scr-confirm">

<div id="portrait-mask">请横屏游玩</div>
<div id="fade"></div>
<script>
(function () {
'use strict';

/* ============================================================
 * §1 Config —— 全部数值常量唯一真源（控制清单 #1）
 * ============================================================ */
const CONFIG = {
  VIEW: { W: 1280, H: 720 },
  STEP: 1 / 60,                       // 固定逻辑步长（秒）
  /* v4.0 基准：体型翻倍 32；攻击键位=左键挥刀/右键重锤（attack.md v4.0 §2）
   * 刃区/锤区扇形锚点=球心、方向=准星；命中=目标本体圈与扇形相交（atan(32/d) 容差） */
  BALL: { R: 32, SPEED: 640 },
  BLADE:  { WINDUP: 0.080, ACTIVE: 0.070, RECOVERY: 0.120,
            LUNGE_SPEED: 900, RADIUS: 128, HALF_ANGLE: Math.PI / 4, COOLDOWN: 0.270 },   // 突进 900×0.070≈63px；总冷却 270ms
  HAMMER: { WINDUP: 0.350, ACTIVE: 0.150, RECOVERY: 0.400,
            RADIUS: 96,  HALF_ANGLE: Math.PI / 6, COOLDOWN: 0.900 },                     // 无突进；总周期 900ms
  /* 【dormant v4.0】防御系统整体废弃（guard.md DEPRECATED）：代码保留、运行时无触发源 */
  GUARD: { MAX_HOLD: 3.0, BLOCK_COOLDOWN: 3.0 },
  /* 刀刀弹开（v4.0 继承 v2.2 语言）：300ms = 击退 60px/150ms + 硬直 150ms，不掉血 */
  CLASH: { DURATION: 0.300, KNOCKBACK: 60, KNOCKBACK_DUR: 0.150,
           RING: { LIFE: 0.200, R1: 40 }, FLASH: 0.060 },
  HP: { MAX: 3 },                     // v4.0：刀三击杀 / 锤秒杀（无视 HP）
  HIT: { FLASH: 0.080, SHAKE: 3, LOW_PULSE: 0.600 },   // v2.2 受击反馈沿用
  BOUNCE: { DURATION: 0.400 },        // 【dormant v4.0】格挡弹开 400ms 强后摇（随 guard 废弃，代码保留）
  /* v2.2 固定站位（全模式统一）：玩家恒左 / 幽灵恒右；「主客互换」作废 */
  SPAWN: {
    PLAYER:   { x: 230,  y: 360 },
    DUMMY:    { x: 1050, y: 360 },    // 第 1 关木桩（HP=3，命中 3 次击碎）
    GHOST:    { x: 1050, y: 360 },    // 幽灵出生点（v2.3 镜像回放后自然对齐）
    L1_PLAYER:{ x: 230,  y: 360 },    // 玩家恒定出生点
  },
  BOUND: { INSET: 32 },               // v4.0：边界内缩 = 体型 32
  FX: { POOL: 300, TRAIL_INTERVAL: 0.040,
        TRAIL:  { LIFE: 0.2, SIZE: 5, ALPHA: 0.25 },
        /* v4.0 挥刀特效（fx.md v4.0 §B）：宽月牙 128px 弧双层 + 刃缘火花 + 残影 2 段 + 震屏 4px */
        BLADE_ARC:  { LIFE: 0.180, WIDTH: 24 },
        BLADE_SPARK:{ N_MIN: 8, N_MAX: 12, SPEED_MIN: 300, SPEED_JITTER: 300, LIFE: 0.3,
                      SIZE_MIN: 2, SIZE_JITTER: 2 },
        BLADE_AFTER:{ N: 2, GAP: 0.025, LIFE: 0.2, ALPHAS: [0.4, 0.25] },   // 挥刀残影 2 段（25ms 间隔）
        /* v4.0 重锤特效（fx.md v4.0 §C）：蓄力涨红+汇聚粒子 / 弧光 96px / 冲击环 / 震屏 8px */
        HAMMER_ARC: { LIFE: 0.250, WIDTH: 32 },
        HAMMER_RING:{ LIFE: 0.250, R1: 70 },
        HAMMER_CHARGE: { N: 12, LIFE: 0.35 },
        KILL:   { N_MIN: 24, N_JITTER: 6, SPEED_MIN: 200, SPEED_JITTER: 320,
                  LIFE: 0.5, SIZE_MIN: 3, SIZE_JITTER: 3,
                  RING: { LIFE: 0.25, R0: 0, R1: 90 }, RING2: { LIFE: 0.35, R0: 0, R1: 130 } },  // 秒杀爆裂 24 粒+双层环
        BURST:  { N_MIN: 14, N_JITTER: 5, SPEED_MIN: 200, SPEED_JITTER: 300,
                  LIFE: 0.5, SIZE_MIN: 3, SIZE_JITTER: 3,
                  RING: { LIFE: 0.25, R0: 0, R1: 90 } },       // 普通死亡爆裂（14~18 粒）
        /* v4.0 球体增亮（fx.md v4.0 §A）：暗背景 0.1s 锁定双球；双层外晕 'lighter' 混合 */
        GLOW:   { PLAYER: { R: 70, A: 0.85 }, GHOST: { R: 70, A: 0.85 } },
        /* v4.1 打断/碎刃专属特效（fx.md v4.1 §C） */
        INTERRUPT: { N_MIN: 6, N_MAX: 8, LIFE: 0.4, SPEED_MIN: 220, SPEED_JITTER: 160, SHAKE: 5 },
        SHATTER: { N_MIN: 10, N_MAX: 14, LIFE: 0.5, SPEED_MIN: 260, SPEED_JITTER: 220 },
  },
  /* v4.1 特写镜头三档（fx.md v4.1 §A）：同帧取最高档；zoom 仅渲染层，timeScale 慢放确定性叠加 */
  CAMERA: {
    T1: { ZOOM: 1.25, TS: 0.3,  DUR: 0.250 },   // 普通命中（刀 −1 / 锤普通秒杀 / 锤锤双杀）
    T2: { ZOOM: 1.35, TS: 0.25, DUR: 0.500 },   // 打断挥锤
    T3: { ZOOM: 1.5,  TS: 0.2,  DUR: 0.800 },   // 碎刃秒杀
  },
  /* v2.2 顶部血量 UI：3 格光条 24×10 间隔 6；组中心 x≈340/940，y=24；标签在血条下 8px */
  HPBAR: { W: 24, H: 10, GAP: 6, Y: 24, CX_P: 340, CX_G: 940, LABEL_DY: 18, RED_FLASH: 0.150 },
  BANNER: { CLEAR_DUR: 1.2, DRAW_DUR: 0.6, ADVANCE_DUR: 1.2 },  // v2.1 AUTO_ADVANCE 横幅 1.2s；DRAW 600ms（v4.0 锤锤复活）
  HITSTOP: 0.120,                     // 普通死亡 / DRAW 复活 120ms
  KILL_HITSTOP: 0.200,                // v4.0 锤秒杀 hitstop 200ms（区别普通死亡 120ms）
  DEATH_SLOW: { DUR: 1.0, SCALE: 0.3 },
  SHAKE: { DEATH: 6, COLLIDE: 10, MISS: 2, HIT: 3, BLADE: 4, HAMMER: 8, DECAY: 0.2 },   // v4.0：出刀 4px / 落锤 8px
  PROTECT_TICKS: 30,                  // 500ms 首帧保护（60Hz × 0.5s）
  /* v4.0 球体增亮：玩家 #FFF8E7 纯亮暖白不透明 1.0 / 幽灵 #9FE8FF 冷青亮芯 0.95（fx.md v4.0 §A） */
  COLOR: { PLAYER: '#FFF8E7', GHOST: '#9FE8FF' },
  /* v3.0 模式 → 存储映射（联机挑战/联机boss/终极boss 随 v3.0 联机改版删除，
   * RemoteGhostStore/ADR-007 作废；联机对战为 PVP 实时对战见 modes.md v3.0） */
  MODES: {
    solo:        { label: '单机挑战', opp: 'dummy', store: null },
    self:        { label: '挑战自我', opp: 'ghost', store: 'local' },
    boss_solo:   { label: '单机boss', opp: 'ghost', store: 'local' },
    demo:        { label: 'AI 对局', opp: 'pvp',   store: null },   // 人机 / AI-vs-AI（OrbAI 管道）
  },
  /* 阈值（progression.md §2 原文数字；v3.0 联机三池阈值随模式删除） */
  THRESHOLDS: {
    SELF_PROMOTE: 20,           // 挑战自我 defeatedPlayers 达 20 → 晋级单机boss
    BOSS_SOLO_DELETE: 20,       // 单机boss challengedSuccess 达 20 → 删除，顺位前移
  },
  VICTORY_DELAY: 0.9,           // VICTORY → RESULT 前的定格时长
};

/* ============================================================
 * §2 Utils —— 纯函数
 * ============================================================ */
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const len   = (x, y) => Math.hypot(x, y);
function norm(x, y) {
  const l = len(x, y);
  return l > 1e-6 ? { x: x / l, y: y / l } : { x: 0, y: 0 };
}
/* v3.0：深冻结（OrbAI 快照防作弊，ai-interface.md §3） */
function deepFreeze(o) {
  if (o && typeof o === 'object') {
    for (const k of Object.keys(o)) deepFreeze(o[k]);
    Object.freeze(o);
  }
  return o;
}

/* ---------- replay 序列化（架构 v2.0 §2）：Uint16 量化 + base64 ----------
 * q = round(x/1280 * 65535)，分辨率 ≈0.02px ≪ r16/r20，镜像回放无损 */
function b64encode(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64decode(str) {
  const s = atob(str);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
function serializeReplay(replay) {
  const n = replay.trajectory.length >> 1;
  const head = new Uint8Array(2 + n * 4);
  const dv = new DataView(head.buffer);
  dv.setUint16(0, n);
  for (let i = 0; i < n; i++) {
    const x = clamp(Math.round(replay.trajectory[2 * i] / CONFIG.VIEW.W * 65535), 0, 65535);
    const y = clamp(Math.round(replay.trajectory[2 * i + 1] / CONFIG.VIEW.H * 65535), 0, 65535);
    dv.setUint16(2 + i * 4, x);
    dv.setUint16(4 + i * 4, y);
  }
  const ev = new TextEncoder().encode(JSON.stringify(replay.events || []));
  const out = new Uint8Array(head.length + 4 + ev.length);
  out.set(head);
  new DataView(out.buffer).setUint32(head.length, ev.length);
  out.set(ev, head.length + 4);
  return b64encode(out);
}
function deserializeReplay(str) {
  const bytes = b64decode(str);
  const dv = new DataView(bytes.buffer);
  const n = dv.getUint16(0);
  const traj = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    traj[2 * i] = dv.getUint16(2 + i * 4) / 65535 * CONFIG.VIEW.W;
    traj[2 * i + 1] = dv.getUint16(4 + i * 4) / 65535 * CONFIG.VIEW.H;
  }
  const evLen = dv.getUint32(2 + n * 4);
  const evJson = new TextDecoder().decode(bytes.subarray(2 + n * 4 + 4, 2 + n * 4 + 4 + evLen));
  let events = [];
  try { events = JSON.parse(evJson); } catch (e) { events = []; }
  return { duration: n * CONFIG.STEP, trajectory: traj, events };
}

/* ============================================================
 * §3 Input —— 键鼠输入系统（v1.1：右键=长按防御）
 * ============================================================ */
/* ---------- v3.0 触屏源（ADR-010 双源聚合 / mobile.md）：纯逻辑类，事件绑定分离 ---------- */
class VirtualJoystick {               // 左半屏动态原点摇杆：底座 r=60、死区 8、全速无比例
  constructor() {
    this.r = 60; this.dead = 8;
    this.pointerId = null; this.origin = null;
    this.axis = { x: 0, y: 0 };       // 归一化输出（死区外即单位向量）
  }
  start(id, x, y) { this.pointerId = id; this.origin = { x, y }; this.axis = { x: 0, y: 0 }; }
  move(id, x, y) {
    if (id !== this.pointerId || !this.origin) return this.axis;
    const dx = x - this.origin.x, dy = y - this.origin.y;
    const d = Math.hypot(dx, dy);
    if (d < this.dead) { this.axis = { x: 0, y: 0 }; return this.axis; }
    this.axis = { x: dx / d, y: dy / d };          // 全速无比例（零惯性手感，mobile.md §2）
    return this.axis;
  }
  end(id) {
    if (id !== this.pointerId) return;
    this.pointerId = null; this.origin = null; this.axis = { x: 0, y: 0 };
  }
  knobOffset() { return { x: this.axis.x * (this.r - 12), y: this.axis.y * (this.r - 12) }; }
}

class TouchButton {                   // 圆钮：按下即生效（不等 touchend）；手指离开即松开
  constructor(x, y, r) { this.x = x; this.y = y; this.r = r;
    this.pressed = false; this.pointerId = null; this.clickPending = false; }
  contains(x, y) { return Math.hypot(x - this.x, y - this.y) <= this.r; }
  down(id) { this.pressed = true; this.pointerId = id; this.clickPending = true; }
  move(id, x, y) {                    // 滑出命中区（1.2 倍容差）即松开（mobile.md §3）
    if (id === this.pointerId && !this.contains(x, y) &&
        Math.hypot(x - this.x, y - this.y) > this.r * 1.2) {
      this.pressed = false; this.pointerId = null;
    }
  }
  up(id) {
    if (id !== this.pointerId) return;
    this.pressed = false; this.pointerId = null;
  }
  consumeClick() { const c = this.clickPending; this.clickPending = false; return c; }
}

class TouchSource {
  constructor() {
    this.joystick = new VirtualJoystick();
    this.btnAtk = new TouchButton(1150, 620, 48);    // 攻击钮 r44 显示 / 命中区 48 等效
    this.btnGuard = new TouchButton(1000, 660, 40);  // 防御钮（斜向错开 120px 圆心距）
    this.visible = false;
  }
  moveAxis() { return this.joystick.axis; }
  /* v4.0：防御钮改派重锤（点按语义）；方向=摇杆当前方向，无摇杆输入由 Player 层朝对手兜底 */
  consumeBlade() { return this.btnAtk.consumeClick(); }
  consumeHammer() { return this.btnGuard.consumeClick(); }
  /* pointerId 隔离分配：进入左半屏的手指→摇杆，其余按位置→按钮（mobile.md §3） */
  pointerDown(id, x, y) {
    if (x < CONFIG.VIEW.W / 2) { if (this.joystick.pointerId === null) this.joystick.start(id, x, y); return; }
    if (this.btnAtk.contains(x, y)) this.btnAtk.down(id);
    else if (this.btnGuard.contains(x, y)) this.btnGuard.down(id);
  }
  pointerMove(id, x, y) {
    this.joystick.move(id, x, y);
    this.btnAtk.move(id, x, y);
    this.btnGuard.move(id, x, y);
  }
  pointerUp(id) {
    this.joystick.end(id);
    this.btnAtk.up(id);
    this.btnGuard.up(id);
  }
}

class Input {
  constructor(canvas) {
    this.held = new Set();
    this.clicks = [];                   // 帧内待消费左键点击（挥刀）
    this._hammerClick = false;          // v4.0：右键点按=重锤（帧内一次消费）
    this.mx = CONFIG.VIEW.W / 2;        // 鼠标逻辑坐标（准星来源）
    this.my = CONFIG.VIEW.H / 2;
    this.touch = new TouchSource();     // v3.0 双源聚合（ADR-010）：键鼠 ⊕ 触屏，双源常开

    window.addEventListener('keydown', (e) => {
      this.held.add(e.code);
      if (e.code.startsWith('Arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => this.held.delete(e.code));
    window.addEventListener('blur', () => {           // 防幽灵键
      this.held.clear();
      this._hammerClick = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) this.clicks.push(e.button);
      if (e.button === 2) this._hammerClick = true;
    });
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      this.mx = (e.clientX - rect.left) / rect.width * CONFIG.VIEW.W;
      this.my = (e.clientY - rect.top) / rect.height * CONFIG.VIEW.H;
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault()); // 控制 #7
  }
  isDown(code) { return this.held.has(code); }
  /* v3.0 聚合：键鼠轴非零优先，否则触屏摇杆轴 */
  getMoveAxis() {
    let x = 0, y = 0;
    if (this.isDown('KeyW') || this.isDown('ArrowUp'))    y -= 1;
    if (this.isDown('KeyS') || this.isDown('ArrowDown'))  y += 1;
    if (this.isDown('KeyA') || this.isDown('ArrowLeft'))  x -= 1;
    if (this.isDown('KeyD') || this.isDown('ArrowRight')) x += 1;
    if (x !== 0 || y !== 0) return norm(x, y);          // 对角归一化
    const t = this.touch.moveAxis();
    if (t.x !== 0 || t.y !== 0) return t;
    return { x: 0, y: 0 };
  }
  consumeBlade() {                      // 帧内消费一次左键（键鼠/触屏任一源）
    const i = this.clicks.indexOf(0);
    if (i >= 0) { this.clicks.splice(i, 1); return true; }
    return this.touch.consumeBlade();   // v3.0 聚合
  }
  consumeHammer() {                     // v4.0：右键点按 / 触屏锤钮（点按）
    const c = this._hammerClick;
    this._hammerClick = false;
    return c || this.touch.consumeHammer();
  }
  /* v4.0 攻击方向 = 准星方向（attack.md §6：鼠标坐标 − 球心，不绑定移动方向；
   * 触屏：摇杆当前方向 > 朝对手兜底；返回零向量时 Player 层兜底朝对手） */
  getAim(pos, game) {
    if (this.touch.visible) {
      const j = this.touch.joystick.axis;
      if (j.x !== 0 || j.y !== 0) return norm(j.x, j.y);
      const foe = game && (game.p2 || game.ghost || game.dummy);
      return foe ? norm(foe.x - pos.x, foe.y - pos.y) : { x: 0, y: 0 };
    }
    return norm(this.mx - pos.x, this.my - pos.y);
  }
  endFrame() { this.clicks.length = 0; } // 未消费的点击不跨帧排队
}

/* ============================================================
 * §4 Entities —— Ball / Player / Dummy / GhostPlayer
 * ============================================================ */
class Ball {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.facing = 0;                  // 朝向角（打击圈方向）
    this.combat = null;
    this.dead = false;
  }
}

class Player extends Ball {
  constructor(x, y) {
    super(x, y, CONFIG.BALL.R);
    this.combat = new Combat();
    this.combat.owner = this;
    this.trailTimer = 0;
  }
  update(dt, input, game) {
    if (this.combat.phase === CombatState.DEAD) return;
    const c = this.combat;

    /* v4.0 攻击意图：方向=准星（getAim），零向量（触屏静止/鼠标未动）→ 朝对手兜底 */
    if (input.consumeBlade() && c.phase === CombatState.IDLE && c.bladeCooldown <= 0) {
      c.startBlade(this._aimDir(input, game), game.tick);
    }
    if (input.consumeHammer() && c.phase === CombatState.IDLE && c.hammerCooldown <= 0) {
      c.startHammer(this._aimDir(input, game), game.tick);
    }

    /* 移动锁：刀起手+判定 / 锤起手+判定 / STAGGER 锁定；各后摇与 IDLE 可移动
     * （attack.md v4.0：锤起手/判定移动锁定；刀突进期锁定） */
    const locked = (c.phase === CombatState.BLADE_WINDUP || c.phase === CombatState.BLADE_ACTIVE ||
                    c.phase === CombatState.HAMMER_WINDUP || c.phase === CombatState.HAMMER_ACTIVE ||
                    c.phase === CombatState.STAGGER);
    if (!locked) {
      const axis = input.getMoveAxis();
      if (axis.x !== 0 || axis.y !== 0) {
        this.x += axis.x * CONFIG.BALL.SPEED * dt;
        this.y += axis.y * CONFIG.BALL.SPEED * dt;
        this.trailTimer += dt;
        if (this.trailTimer >= CONFIG.FX.TRAIL_INTERVAL) {
          this.trailTimer = 0;
          game.fx.queue.push({ type: 'trail', x: this.x, y: this.y });
        }
      }
    }
    this.clampToBounds();

    c.update(dt);
  }
  /* v4.0 准星方向兜底链：输入源准星 → 朝对手（attack.md §6 触屏口径；架构 §3.1 延续） */
  _aimDir(input, game) {
    const dir = input.getAim(this, game);
    if (dir.x !== 0 || dir.y !== 0) return dir;
    const foe = game.p2 || game.ghost || game.dummy;
    return foe ? norm(foe.x - this.x, foe.y - this.y) : { x: 1, y: 0 };
  }
  clampToBounds() {
    const i = CONFIG.BOUND.INSET;
    this.x = clamp(this.x, i, CONFIG.VIEW.W - i);
    this.y = clamp(this.y, i, CONFIG.VIEW.H - i);
  }
}

class Dummy extends Ball {           // 不移动、不还手，仅可被命中（v2.2：HP=3，命中 3 次击碎）
  constructor(x, y) {
    super(x, y, CONFIG.BALL.R);
    this.combat = new Combat();
    this.combat.owner = this;
  }
}

class GhostPlayer extends Ball {
  constructor(replay, offsetX, offsetY) {
    /* v2.3 水平镜像复刻：回放位置 x' = 1280 − x，offset = 幽灵出生点 − 镜像后玩家出生点
     * （由 CONFIG 推导，勿硬编码；SPAWN.GHOST=1050、VIEW.W−SPAWN.PLAYER.x=1050 → offset=(0,0)） */
    super(CONFIG.SPAWN.GHOST.x, CONFIG.SPAWN.GHOST.y, CONFIG.BALL.R);
    this.replay = replay;
    this.offX = offsetX; this.offY = offsetY;
    this.combat = new Combat();
    this.combat.owner = this;
    this.combat.onAction = null;      // 幽灵不回录
    this.eventPtr = 0;
    this._lastTT = 0;
  }
  /* 入参 tick = Match.tick（与录制事件 t 同源，控制 #11）；循环回放 t mod T，镜像复刻 */
  update(tick, dt, game) {
    if (this.combat.phase === CombatState.DEAD) return;
    const traj = this.replay.trajectory;
    const T = traj.length / 2;
    const tt = tick % T;
    if (tt < this._lastTT) this.eventPtr = 0;   // 循环接缝：事件指针归零
    this._lastTT = tt;

    this.x = CONFIG.VIEW.W - traj[2 * tt] + this.offX;     // v2.3：水平镜像，y 不变
    this.y = traj[2 * tt + 1] + this.offY;
    this.clampToBounds();

    // 事件回放：整数帧号比较（控制 #3）；非 IDLE 到达的事件安全丢弃（控制 #14）
    // v4.0：charge→blade 映射（历史 replay 兼容）、hammer 执行、guard 事件静默跳过
    const events = this.replay.events;
    while (this.eventPtr < events.length && events[this.eventPtr].t <= tt) {
      const ev = events[this.eventPtr++];
      if (ev.t < CONFIG.PROTECT_TICKS) continue;  // 首帧保护：500ms 内动作不触发
      if (ev.type === 'charge' || ev.type === 'blade' || ev.type === 'hammer') {
        if (this.combat.phase === CombatState.IDLE) {
          // v2.3 镜像换算（回放侧唯一换算点）：dirAngle' = π − dirAngle
          // 玩家朝右(dirAngle=0) → 幽灵朝左(facing=π)
          const ang = Math.PI - ev.dirAngle;
          const dir = { x: Math.cos(ang), y: Math.sin(ang) };
          if (ev.type === 'hammer') this.combat.startHammer(dir, tick);   // 旧幽灵永不挥锤→历史无 hammer 事件
          else this.combat.startBlade(dir, tick);
        }
      }
      // guard_begin / guard_end（历史 replay）：静默跳过（guard.md DEPRECATED）
    }

    this.combat.update(dt);
  }
  clampToBounds() {
    const i = CONFIG.BOUND.INSET;
    this.x = clamp(this.x, i, CONFIG.VIEW.W - i);
    this.y = clamp(this.y, i, CONFIG.VIEW.H - i);
  }
}

/* ============================================================
 * §5 Combat —— 战斗状态机 + 命中判定（v4.0 刀与锤）
 * 相位枚举即联机快照 phase 字符串（ai-interface.md v4.0，小写）；
 * GUARD/GUARD_RELEASE/BOUNCE/CLASH 为 dormant 项（guard.md DEPRECATED：代码保留无触发源）
 * ============================================================ */
const CombatState = { IDLE: 'idle',
  BLADE_WINDUP: 'blade_windup', BLADE_ACTIVE: 'blade_active', BLADE_RECOVERY: 'blade_recovery',
  HAMMER_WINDUP: 'hammer_windup', HAMMER_ACTIVE: 'hammer_active', HAMMER_RECOVERY: 'hammer_recovery',
  STAGGER: 'stagger', DEAD: 'dead',
  /* dormant：防御姿态/冷却/格挡弹开/旧对撞弹开（v4.0 起无触发源） */
  GUARD: 'GUARD', GUARD_RELEASE: 'GUARD_RELEASE', BOUNCE: 'BOUNCE', CLASH: 'CLASH' };

class Combat {
  constructor() {
    this.phase = CombatState.IDLE;
    this.t = 0;                       // 阶段内计时
    this.startTick = -1;              // 本次攻击起手帧号（录制事件 t 同源）
    this.aimDir = { x: 1, y: 0 };     // 攻击方向单位向量（准星方向，出招即锁定）
    this.dashFrom = { x: 0, y: 0 };   // BLADE_ACTIVE 突进 / STAGGER 击退端点插值（控制 #4）
    this.dashTo = { x: 0, y: 0 };
    this.onAction = null;             // (type, dirAngle) → Recorder（仅玩家）
    /* HP=3：刀 −1 / 锤秒杀（无视 HP 直接 kill()）；命中结算标记（每次攻击对同一目标至多一次） */
    this.hp = CONFIG.HP.MAX;
    this.maxHP = CONFIG.HP.MAX;
    this._hitVictims = new Set();
    /* v4.0 刀锤双冷却独立（从出招起算；共享攻击状态槽，互不取消） */
    this.bladeCooldown = 0;
    this.hammerCooldown = 0;
    /* 【dormant v4.0】防御冷却三分支字段（无触发源，保留） */
    this._guardDur = 0;
    this._coolDur = 0;
    this._expire = false;
  }
  _record(type, ang) { if (this.onAction) this.onAction(type, ang); }

  _beginAttack(state, spec, aimVec, tick) {
    this.phase = state;
    this.t = 0;
    this.startTick = tick;
    this.aimDir = aimVec;             // 出招即锁定不修正（准星方向）
    this.owner.facing = Math.atan2(aimVec.y, aimVec.x);
    this._hitVictims.clear();         // 新攻击新结算窗口（同一目标至多一次）
  }

  /* 左键挥刀：三段 80/70/120ms + 突进 63px 朝准星；总冷却 270ms（出招起算） */
  startBlade(aimVec, tick) {
    if (this.phase !== CombatState.IDLE || this.bladeCooldown > 0) return false;
    this._beginAttack(CombatState.BLADE_WINDUP, CONFIG.BLADE, aimVec, tick);
    this.bladeCooldown = CONFIG.BLADE.COOLDOWN;
    this._record('blade', this.owner.facing);
    return true;
  }

  /* 右键重锤：三段 350/150/400ms 无突进；总冷却 900ms；全身无无敌 */
  startHammer(aimVec, tick) {
    if (this.phase !== CombatState.IDLE || this.hammerCooldown > 0) return false;
    this._beginAttack(CombatState.HAMMER_WINDUP, CONFIG.HAMMER, aimVec, tick);
    this.hammerCooldown = CONFIG.HAMMER.COOLDOWN;
    this._record('hammer', this.owner.facing);
    return true;
  }

  /* 【dormant v4.0】防御入口（无触发源）：仅 IDLE 可进 */
  startGuard() {
    if (this.phase !== CombatState.IDLE) return false;
    this.phase = CombatState.GUARD;
    this.t = 0;
    this._expire = false;
    this._record('guard_begin');
    return true;
  }

  /* 【dormant v4.0】GUARD → GUARD_RELEASE 冷却计时通道。幂等 */
  releaseGuard(reason) {
    if (this.phase !== CombatState.GUARD) return false;
    this._guardDur = this.t;
    this._coolDur = (reason === 'manual') ? this._guardDur : CONFIG.GUARD.BLOCK_COOLDOWN;
    this.phase = CombatState.GUARD_RELEASE;
    this.t = 0;
    this._expire = false;
    this._record('guard_end');
    return true;
  }

  /* 【dormant v4.0】格挡弹开 400ms（攻击者强后摇，无触发源） */
  bounce() {
    console.assert(this.phase === 'blade_active', 'bounce only from blade_active');
    this.phase = CombatState.BOUNCE;
    this.t = 0;
  }

  /* v4.0 刀刀弹开（继承 v2.2 对撞语言）：沿连线向外击退 60px/150ms + 硬直 150ms，不掉血 */
  stagger(dirVec) {
    this.phase = CombatState.STAGGER;
    this.t = 0;
    const i = CONFIG.BOUND.INSET;
    this.dashFrom = { x: this.owner.x, y: this.owner.y };
    this.dashTo = {
      x: clamp(this.owner.x + dirVec.x * CONFIG.CLASH.KNOCKBACK, i, CONFIG.VIEW.W - i),
      y: clamp(this.owner.y + dirVec.y * CONFIG.CLASH.KNOCKBACK, i, CONFIG.VIEW.H - i),
    };
  }

  /* 刀命中：HP −1，归 0 才死。返回 'dead' | 'hit' */
  hit() {
    console.assert(this.phase !== 'dead', 'no hit on dead');
    this.hp -= 1;
    if (this.hp <= 0) { this.hp = 0; this.phase = CombatState.DEAD; this.t = 0; return 'dead'; }
    return 'hit';
  }

  /* 锤秒杀 / 直接击杀：无视 HP 直接进死亡流程 */
  kill() {
    console.assert(this.phase !== 'dead', 'no double-kill');
    this.hp = 0;
    this.phase = CombatState.DEAD;
    this.t = 0;
  }

  update(dt) {
    if (this.phase === CombatState.DEAD) return;
    /* 刀锤双冷却独立流逝（与相位无关；DEAD 不减） */
    if (this.bladeCooldown > 0) this.bladeCooldown = Math.max(0, this.bladeCooldown - dt);
    if (this.hammerCooldown > 0) this.hammerCooldown = Math.max(0, this.hammerCooldown - dt);

    switch (this.phase) {
      case CombatState.BLADE_WINDUP:
        this.t += dt;
        if (this.t >= CONFIG.BLADE.WINDUP) {
          this.phase = CombatState.BLADE_ACTIVE;
          this.t = 0;
          const dist = CONFIG.BLADE.LUNGE_SPEED * CONFIG.BLADE.ACTIVE;   // 900×0.070=63px
          const i = CONFIG.BOUND.INSET;
          this.dashFrom = { x: this.owner.x, y: this.owner.y };
          // 突进端点按边界内缩约束（attack.md §7.1：扇形几何照算，位移 clamp）
          this.dashTo = {
            x: clamp(this.owner.x + this.aimDir.x * dist, i, CONFIG.VIEW.W - i),
            y: clamp(this.owner.y + this.aimDir.y * dist, i, CONFIG.VIEW.H - i),
          };
        }
        break;
      case CombatState.BLADE_ACTIVE: {
        this.t += dt;
        const k = Math.min(1, this.t / CONFIG.BLADE.ACTIVE);
        this.owner.x = lerp(this.dashFrom.x, this.dashTo.x, k);
        this.owner.y = lerp(this.dashFrom.y, this.dashTo.y, k);
        if (this.t >= CONFIG.BLADE.ACTIVE) { this.phase = CombatState.BLADE_RECOVERY; this.t = 0; }
        break;
      }
      case CombatState.BLADE_RECOVERY:
        this.t += dt;
        if (this.t >= CONFIG.BLADE.RECOVERY) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      case CombatState.HAMMER_WINDUP:                 // 起手+判定移动锁定（重承诺）
        this.t += dt;
        if (this.t >= CONFIG.HAMMER.WINDUP) { this.phase = CombatState.HAMMER_ACTIVE; this.t = 0; }
        break;
      case CombatState.HAMMER_ACTIVE:
        this.t += dt;
        if (this.t >= CONFIG.HAMMER.ACTIVE) { this.phase = CombatState.HAMMER_RECOVERY; this.t = 0; }
        break;
      case CombatState.HAMMER_RECOVERY:
        this.t += dt;
        if (this.t >= CONFIG.HAMMER.RECOVERY) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      case CombatState.STAGGER: {                     // 弹开 300ms：击退 60px/150ms + 硬直 150ms
        this.t += dt;
        {                                             // 击退段：端点插值（k 钳 1，硬直段钉在终点）
          const k = Math.min(1, this.t / CONFIG.CLASH.KNOCKBACK_DUR);
          this.owner.x = lerp(this.dashFrom.x, this.dashTo.x, k);
          this.owner.y = lerp(this.dashFrom.y, this.dashTo.y, k);
        }
        if (this.t >= CONFIG.CLASH.DURATION) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      }
      /* 【dormant v4.0】GUARD / GUARD_RELEASE / BOUNCE / CLASH 分支保留，无触发源 */
      case CombatState.GUARD:
        this.t += dt;
        if (this.t >= CONFIG.GUARD.MAX_HOLD) {
          if (!this._expire) { this._expire = true; this.t = CONFIG.GUARD.MAX_HOLD; }
          else if (this.t >= CONFIG.GUARD.MAX_HOLD + CONFIG.STEP - 1e-9) {
            this.releaseGuard('timeout');
          }
        }
        break;
      case CombatState.GUARD_RELEASE:
        this.t += dt;
        if (this.t >= this._coolDur) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      case CombatState.BOUNCE:
        this.t += dt;
        if (this.t >= CONFIG.BOUNCE.DURATION) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      case CombatState.CLASH: {
        this.t += dt;
        {
          const k = Math.min(1, this.t / CONFIG.CLASH.KNOCKBACK_DUR);
          this.owner.x = lerp(this.dashFrom.x, this.dashTo.x, k);
          this.owner.y = lerp(this.dashFrom.y, this.dashTo.y, k);
        }
        if (this.t >= CONFIG.CLASH.DURATION) { this.phase = CombatState.IDLE; this.t = 0; }
        break;
      }
      default: break;
    }
  }

  canBeHit() { return this.phase !== CombatState.DEAD; }
}

/* ---------- v4.0 扇形攻击区几何（attack.md v4.0 §2） ----------
 * 锚点=球心、方向=准星（facing）；命中 = 目标本体圈(r32)与扇形区相交，
 * 角度按 atan(32/d) 容差补偿目标体型、距离按 radius + 32 补偿。 */
function sectorOf(b) {
  const spec = b.combat.phase === CombatState.HAMMER_ACTIVE ? CONFIG.HAMMER : CONFIG.BLADE;
  return { x: b.x, y: b.y, dirAngle: b.facing, radius: spec.RADIUS, halfAngle: spec.HALF_ANGLE };
}
function sectorHits(sec, target) {
  const dx = target.x - sec.x, dy = target.y - sec.y;
  const d = len(dx, dy);
  if (!Number.isFinite(d)) return false;            // NaN 防御（v1.2 契约延续）
  if (d > sec.radius + target.r) return false;      // 距离含体型补偿
  const tol = Math.atan(target.r / Math.max(d, 1e-6));
  let da = Math.atan2(dy, dx) - sec.dirAngle;
  da = Math.atan2(Math.sin(da), Math.cos(da));      // wrap 到 [-π, π]
  return Math.abs(da) <= sec.halfAngle + tol;
}

/* Step1 收集用纯判定（v4.0 命中矩阵，只读，供 adjudicate 与单测共用）：
 * 'blade'（刀判定帧接触）| 'hammer'（锤判定帧接触）| null
 * 无敌态已不存在——起手/后摇全身可被打（v2.2 攻期无敌条款作废） */
function checkAttackHit(attacker, defender) {
  const ac = attacker.combat;
  if (ac.phase !== CombatState.BLADE_ACTIVE && ac.phase !== CombatState.HAMMER_ACTIVE) return null;
  if (defender.combat.phase === CombatState.DEAD) return null;
  if (ac._hitVictims.has(defender)) return null;   // 同一攻击对同一目标至多一次
  const sec = sectorOf(attacker);
  if (!sectorHits(sec, defender)) return null;
  return ac.phase === CombatState.BLADE_ACTIVE ? 'blade' : 'hammer';
}

/* HitResolver 裁决核心（Step2，v4.0 §5.3 结算顺序，对称纯函数，控制 #15）：
 * ① 刀刀刃区相交 → 弹开 300ms（优先于逐点命中）
 * ② 锤锤互中 → 双方同时秒杀 → DRAW 复活
 * ③ 剩余接触逐点套矩阵（{type:'list'}：刀+锤混合事件逐条结算；单条亦是 list[0]）
 *    ——目标刀判定帧且攻击者在其刃区内 → 无效格挡；否则刀 −1 HP / 锤秒杀 */
function adjudicate(events) {
  if (events.length === 0) return { type: 'none' };
  const blades = events.filter((e) => e.kind === 'blade');
  const hammers = events.filter((e) => e.kind === 'hammer');
  if (blades.length === 2 &&
      sectorHits(sectorOf(blades[0].attacker), blades[1].attacker) &&
      sectorHits(sectorOf(blades[1].attacker), blades[0].attacker)) {
    return { type: 'stagger', a: blades[0].attacker, b: blades[1].attacker };
  }
  if (hammers.length === 2) return { type: 'draw_kill', a: hammers[0].attacker, b: hammers[1].attacker };
  /* v4.1 ②.5 碎刃裁决（attack.md v4.1 B）：锤判定帧砸在对方刀判定帧刃区内 → 刀方直接秒杀
   * （无视 HP 与刃区保护）。相位按帧首判（D.1：e.defPhase 缺省回落实时相位） */
  for (const e of events) {
    if (e.kind !== 'hammer') continue;
    const dphase = e.defPhase !== undefined ? e.defPhase : e.defender.combat.phase;
    if (dphase === CombatState.BLADE_ACTIVE && sectorHits(sectorOf(e.defender), e.attacker)) {
      return { type: 'break_kill', winner: e.attacker, loser: e.defender };
    }
  }
  return { type: 'list', list: events.map(_resolveOne) };
}
/* ③ 单条接触的矩阵行判定（v4.1 5.1 刀→目标 / 5.2 锤→目标） */
function _resolveOne(e) {
  const dphase = e.defPhase !== undefined ? e.defPhase : e.defender.combat.phase;
  /* 刃区格挡（仅刀保留）：目标刀判定帧且攻击者落在其刃区内 → 刀光消散
   * （v4.1 修订：锤砸刃区已在 ②.5 裁决为碎刃秒杀，不再走此通道） */
  if (e.kind === 'blade' && dphase === CombatState.BLADE_ACTIVE &&
      sectorHits(sectorOf(e.defender), e.attacker)) {
    return { type: 'ineffective', attacker: e.attacker, defender: e.defender };
  }
  if (e.kind === 'hammer') return { type: 'kill', winner: e.attacker, loser: e.defender };
  /* v4.1 打断：刀命中锤起手（全身无保护）→ −1 HP + 锤相位取消（结算见 Match.resolveHits） */
  if (dphase === CombatState.HAMMER_WINDUP) return { type: 'interrupt', winner: e.attacker, loser: e.defender };
  return { type: 'hit', winner: e.attacker, loser: e.defender };
}

/* v2.2 E 实体碰撞：两球本体圈重叠 → 沿连线软推挤分离至恰好不重叠
 * 任何状态、无伤害、无特效、不触发任何状态；DEAD 不推（尸体静止）。
 * 攻击路径被碰撞截停：每帧分离修正后扇形区随实际球心（sectorOf 每次重算） */
function resolveOverlap(a, b) {
  if (a.combat.phase === CombatState.DEAD || b.combat.phase === CombatState.DEAD) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = len(dx, dy);
  const min = a.r + b.r;
  if (d >= min) return;
  const push = (min - d) / 2;                   // 各推一半重叠量
  const ux = d > 1e-6 ? dx / d : 1, uy = d > 1e-6 ? dy / d : 0;   // 完全重合 → 沿 +x 分离
  const i = CONFIG.BOUND.INSET;
  a.x = clamp(a.x - ux * push, i, CONFIG.VIEW.W - i);
  a.y = clamp(a.y - uy * push, i, CONFIG.VIEW.H - i);
  b.x = clamp(b.x + ux * push, i, CONFIG.VIEW.W - i);
  b.y = clamp(b.y + uy * push, i, CONFIG.VIEW.H - i);
}

/* ============================================================
 * §5.5 CameraSystem —— 特写镜头（fx.md v4.1）：仅渲染层变换 + timeScale 慢放
 * zoom 以接触点为锚 ease-in-out 回 1.0；同帧多时刻取最高档（T3>T2>T1）；
 * 特写时长走缩放后时间（hitstop 冻结期同步暂停＝「包裹」语义）。
 * 逻辑坐标零影响：replay / 联机确定性不受 zoom 变换影响。
 * ============================================================ */
class CameraSystem {
  constructor() {
    this.active = false;
    this.tier = 0;
    this.t = 0; this.dur = 0;
    this.anchor = { x: 0, y: 0 };
    this._pending = null;               // 本帧待决时刻（同帧取最高档）
  }
  /* 逻辑期入队（resolveHits 裁决 / 访客快照事件流） */
  queue(tier, x, y) {
    if (!this._pending || tier > this._pending.tier) this._pending = { tier, x, y };
  }
  /* 帧首提交：高档抢占进行中的低档（不叠加）；低档不打断高档 */
  beginFrame() {
    if (this._pending) {
      if (!this.active || this._pending.tier > this.tier) {
        this.active = true;
        this.tier = this._pending.tier;
        this.t = 0;
        this.dur = CONFIG.CAMERA['T' + this.tier].DUR;
        this.anchor = { x: this._pending.x, y: this._pending.y };
      }
      this._pending = null;
    }
  }
  /* dt = 世界体验时间（缩放后）：hitstop（scale=0）期间特写同步冻结 */
  update(dt) {
    if (!this.active) return;
    this.t += dt;
    if (this.t >= this.dur) { this.active = false; this.tier = 0; }
  }
  /* 逻辑时间缩放：激活档的 TS（叠加取最高档），未激活 = 1 */
  timeScale() { return this.active ? CONFIG.CAMERA['T' + this.tier].TS : 1; }
  /* 仅渲染层：zoom 朝接触点 ease-in-out 包络（0→1→0），结束回 1.0；
   * 触控坐标换算不经过此 transform（触屏 hit 检测豁免） */
  applyTransform(ctx, W, H) {
    if (!this.active) return;
    const spec = CONFIG.CAMERA['T' + this.tier];
    const p = clamp(this.t / this.dur, 0, 1);
    const env = 0.5 - 0.5 * Math.cos(p * Math.PI);      // ease-in-out
    const zoom = 1 + (spec.ZOOM - 1) * env;
    const cx = lerp(W / 2, this.anchor.x, env);
    const cy = lerp(H / 2, this.anchor.y, env);
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cx, -cy);
  }
}

/* ============================================================
 * §6 Recorder —— 轨迹录制 / 回放数据（ADR-003 混合结构）
 * ============================================================ */
class Recorder {
  constructor() {
    this.frames = new Float32Array(1024 * 2);  // 增长式缓冲，倍增扩容
    this.events = [];
    this.tickCount = 0;
    this.recording = false;
  }
  begin() {                            // TUTORIAL 进入时调用
    this.frames = new Float32Array(1024 * 2);
    this.events = [];
    this.tickCount = 0;
    this.recording = true;
  }
  _ensure(cap) {
    if (cap <= this.frames.length) return;
    let n = this.frames.length;
    while (n < cap) n *= 2;
    const bigger = new Float32Array(n);
    bigger.set(this.frames);
    this.frames = bigger;
  }
  sample(x, y) {                       // 每逻辑帧调用一次
    if (!this.recording) return;
    this._ensure((this.tickCount + 1) * 2);
    this.frames[2 * this.tickCount] = x;
    this.frames[2 * this.tickCount + 1] = y;
    this.tickCount++;
  }
  /* v1.1 事件类型：charge{dirAngle} / guard_begin / guard_end
   * t 由调用方传 Game.tick（控制 #11：与 startTick、回放 tick 同源） */
  recordAction(type, dirAngle, t) {
    if (!this.recording) return;
    this.events.push({ t: (t !== undefined ? t : this.tickCount), type, dirAngle });
  }
  /* v2.0：不停录截取当前进度（solo 教学关 → 镜像幽灵来源） */
  snapshot() {
    const trajectory = this.frames.slice(0, this.tickCount * 2);
    const events = this.events.filter((e) => e.t <= this.tickCount);
    return { duration: this.tickCount * CONFIG.STEP, trajectory, events };
  }
  /* v2.0：DRAW 等无效段丢弃——清空缓冲但保持录制（modes.md §3.2） */
  reset() {
    this.events = [];
    this.tickCount = 0;
  }
  /* TUTORIAL_CLEAR 时调用；平局/死亡重开不重录 */
  finalize() {
    this.recording = false;
    const trajectory = this.frames.slice(0, this.tickCount * 2);
    const events = this.events.slice().sort((a, b) => a.t - b.t);
    return {
      duration: this.tickCount * CONFIG.STEP,
      trajectory,                      // 长度 = 2*tickCount
      events,
    };
  }
}

/* ============================================================
 * §7 FX —— 粒子池 + 特效播放器（ADR-004：预分配 300 + 事件队列）
 * ============================================================ */
class Particle {
  constructor() { this.alive = false; this.init(0, 0, 0, 0, 0, 0, '#fff'); }
  init(x, y, vx, vy, life, size, color) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.size = size;
    this.color = color; this.alive = true; this.kind = 'dot';
  }
}

class FXSystem {
  constructor() {
    this.pool = [];
    for (let i = 0; i < CONFIG.FX.POOL; i++) this.pool.push(new Particle());
    this.freeList = [];               // 索引栈
    for (let i = CONFIG.FX.POOL - 1; i >= 0; i--) this.freeList.push(i);
    this.queue = [];                  // 逻辑期只入队，帧末 flush（控制 #2）
    this.lastEmitted = [];            // v3.1：flush 前的帧事件副本（联机快照 events 字段来源）
    this.afterimages = [];            // v4.0：挥刀残影 2 段（球体轮廓快照）
    this.arcs = [];                   // v4.0：宽月牙刃光 / 锤击弧光（扇形弧段，双层）
    this.rings = [];                  // 冲击环（r0→r1）：死亡爆裂 / 秒杀双层环 / 弹开双环
    this.shake = 0;                   // 屏幕震动幅度（仅渲染层偏移，不回写世界坐标）
    this.ambientAlive = 0;            // 氛围粒子存活计数（menu.md §6 上限 40）
  }

  /* 池分配：优先 freeList；耗尽则回收最老 trail（ADR-004 优先级丢弃） */
  _alloc(kind) {
    if (this.freeList.length > 0) return this.pool[this.freeList.pop()];
    let victim = -1, oldest = Infinity;
    for (let i = 0; i < this.pool.length; i++) {
      const p = this.pool[i];
      if (!p.alive) { victim = i; break; }
      if (p.kind === 'trail' && p.life < oldest) { oldest = p.life; victim = i; }
    }
    if (victim < 0) for (let i = 0; i < this.pool.length; i++) {
      if (this.pool[i].life < oldest) { oldest = this.pool[i].life; victim = i; }
    }
    if (victim >= 0) { this.pool[victim].alive = false; return this.pool[victim]; }
    return null;
  }

  emit(ev) {
    const r = Math.random;
    const FX = CONFIG.FX;
    switch (ev.type) {
      case 'trail':
        this._spawn(ev.x, ev.y, 0, 0, FX.TRAIL.LIFE, FX.TRAIL.SIZE, CONFIG.COLOR.PLAYER, 'trail');
        break;
      case 'blade_afterimages': {      // v4.0：挥刀残影 2 段（沿突进方向 25ms 间隔，寿命 200ms）
        const A = FX.BLADE_AFTER;
        const step = CONFIG.BLADE.LUNGE_SPEED * A.GAP;   // 22.5px/段（900×0.025）
        for (let k = 0; k < A.N; k++) {
          this.afterimages.push({
            x: ev.x + Math.cos(ev.ang) * step * k,
            y: ev.y + Math.sin(ev.ang) * step * k,
            r: ev.r, color: ev.color,
            life: A.LIFE, maxLife: A.LIFE, alpha: A.ALPHAS[k],
          });
        }
        break;
      }
      case 'blade_swing': {            // v4.0 §B：宽月牙刃光 128px 弧宽 24 双层 + 刃缘火花 8~12 + 震屏 4px
        const BA = FX.BLADE_ARC;
        const life = ev.fade ? 0.040 : BA.LIFE;          // 无效命中（刃区格挡）：光弧提前消散 40ms
        this.arcs.push({ x: ev.x, y: ev.y, ang: ev.ang, radius: CONFIG.BLADE.RADIUS,
                         width: BA.WIDTH, life, maxLife: life, color: ev.color, glow: true });
        if (!ev.fade) {
          const SP = FX.BLADE_SPARK;
          const n = SP.N_MIN + Math.floor(r() * (SP.N_MAX - SP.N_MIN + 1));
          for (let k = 0; k < n; k++) {
            const a = ev.ang + (r() - 0.5) * CONFIG.BLADE.HALF_ANGLE * 2;   // 沿弧缘飞溅
            const sp = SP.SPEED_MIN + r() * SP.SPEED_JITTER;
            const sx = ev.x + Math.cos(a) * CONFIG.BLADE.RADIUS * 0.8;
            const sy = ev.y + Math.sin(a) * CONFIG.BLADE.RADIUS * 0.8;
            this._spawn(sx, sy, Math.cos(a) * sp, Math.sin(a) * sp,
                        SP.LIFE, SP.SIZE_MIN + r() * SP.SIZE_JITTER, ev.color, 'dot');
          }
          this.shake = Math.max(this.shake, CONFIG.SHAKE.BLADE);
        }
        break;
      }
      case 'hammer_charge': {          // v4.0 §C：蓄力 12 枚汇聚粒子（起手一次性发射）
        const HC = FX.HAMMER_CHARGE;
        for (let k = 0; k < HC.N; k++) {
          const a = r() * Math.PI * 2, d = 90 + r() * 40;
          const p = this._spawn(ev.x, ev.y, 0, 0, HC.LIFE, 3, '#ff6b6b', 'dot');
          if (p) { p._home = { x: ev.x, y: ev.y }; p._off = { x: Math.cos(a) * d, y: Math.sin(a) * d }; }
        }
        break;
      }
      case 'hammer_strike': {          // v4.0 §C：锤击弧光 96px 弧宽 32 寿命 250ms + 冲击环 r0→70 + 震屏 8px
        const HA = FX.HAMMER_ARC;
        this.arcs.push({ x: ev.x, y: ev.y, ang: ev.ang, radius: CONFIG.HAMMER.RADIUS,
                         width: HA.WIDTH, life: HA.LIFE, maxLife: HA.LIFE, color: '#ffd9c4', glow: false });
        this.rings.push({ x: ev.x + Math.cos(ev.ang) * CONFIG.HAMMER.RADIUS * 0.7,
                          y: ev.y + Math.sin(ev.ang) * CONFIG.HAMMER.RADIUS * 0.7,
                          life: FX.HAMMER_RING.LIFE, maxLife: FX.HAMMER_RING.LIFE,
                          r0: 0, r1: FX.HAMMER_RING.R1 });
        this.shake = Math.max(this.shake, CONFIG.SHAKE.HAMMER);
        break;
      }
      case 'interrupt_fx': {           // v4.1 T2 打断：锤脱手粒子 6~8 枚沿锤方向惯性飞散 + 震屏 5px
        const IT = FX.INTERRUPT;       // （锤弧截断消散由 camera 慢放窗口内的光弧自然消退呈现）
        const n = IT.N_MIN + Math.floor(r() * (IT.N_MAX - IT.N_MIN + 1));
        for (let k = 0; k < n; k++) {
          const a = (ev.ang || 0) + (r() - 0.5) * 1.2;
          const sp = IT.SPEED_MIN + r() * IT.SPEED_JITTER;
          this._spawn(ev.x, ev.y, Math.cos(a) * sp, Math.sin(a) * sp,
                      IT.LIFE, 2 + r() * 2, '#ff8a7a', 'dot');
        }
        this.shake = Math.max(this.shake, IT.SHAKE);
        break;
      }
      case 'blade_shatter': {          // v4.1 T3 碎刃：刃片 10~14 枚沿弧缘法线飞散（秒杀爆裂由 burst kill 承担）
        const SH = FX.SHATTER;
        const n = SH.N_MIN + Math.floor(r() * (SH.N_MAX - SH.N_MIN + 1));
        for (let k = 0; k < n; k++) {
          const a = (ev.ang || 0) + (r() - 0.5) * CONFIG.BLADE.HALF_ANGLE * 2;
          const sp = SH.SPEED_MIN + r() * SH.SPEED_JITTER;
          this._spawn(ev.x + Math.cos(a) * CONFIG.BLADE.RADIUS * 0.6,
                      ev.y + Math.sin(a) * CONFIG.BLADE.RADIUS * 0.6,
                      Math.cos(a) * sp, Math.sin(a) * sp, SH.LIFE, 2 + r() * 2, '#dff2ff', 'dot');
        }
        this.shake = Math.max(this.shake, CONFIG.SHAKE.HAMMER);
        break;
      }
      case 'clash_ring': {             // v2.2 对撞弹开：双向冲击环 r0→40px，200ms
        this.rings.push({ x: ev.x, y: ev.y, life: CONFIG.CLASH.RING.LIFE,
                          maxLife: CONFIG.CLASH.RING.LIFE, r0: 0, r1: CONFIG.CLASH.RING.R1,
                          dir: ev.dir || 0 });
        break;
      }
      case 'burst': {                  // 死亡爆裂 14~18 粒 + 冲击环；ev.kill=true → 秒杀升级（fx.md v4.0 §C）；ev.small → 命中火花 8~10 粒零震屏
        const K = ev.kill ? FX.KILL : FX.BURST;
        const n = ev.small ? (8 + Math.floor(r() * 3)) : (K.N_MIN + Math.floor(r() * (K.N_JITTER + 1)));
        for (let k = 0; k < n; k++) {
          const a = r() * Math.PI * 2, sp = K.SPEED_MIN + r() * K.SPEED_JITTER;
          this._spawn(ev.x, ev.y, Math.cos(a) * sp, Math.sin(a) * sp,
                      K.LIFE, K.SIZE_MIN + r() * (K.SIZE_JITTER + 1), ev.color, 'dot');
        }
        if (!ev.small) {
          this.rings.push({ x: ev.x, y: ev.y, life: K.RING.LIFE, maxLife: K.RING.LIFE,
                            r0: K.RING.R0, r1: K.RING.R1 });
        }
        if (ev.kill) {                 // 秒杀双层冲击环（r1=90 / r1=130）
          const K2 = FX.KILL.RING2;
          this.rings.push({ x: ev.x, y: ev.y, life: K2.LIFE, maxLife: K2.LIFE,
                            r0: K2.R0, r1: K2.R1 });
        }
        if (!ev.small) this.shake = Math.max(this.shake, ev.shake || CONFIG.SHAKE.DEATH);
        break;
      }
      case 'miss':
        this.shake = Math.max(this.shake, CONFIG.SHAKE.MISS);
        break;
      case 'ambient': {                // v2.0 主菜单氛围：缓慢漂浮光球（≤40 枚，menu.md §6）
        if (this.ambientAlive >= 40) break;
        const x = Math.random() * CONFIG.VIEW.W;
        const y = CONFIG.VIEW.H + 10;
        this._spawn(x, y, (Math.random() - 0.5) * 12, -(8 + Math.random() * 22),
                    4 + Math.random() * 4, 2 + Math.random() * 2.5,
                    Math.random() < 0.7 ? CONFIG.COLOR.PLAYER : CONFIG.COLOR.GHOST, 'ambient');
        this.ambientAlive++;
        break;
      }
      default: break;
    }
  }
  _spawn(x, y, vx, vy, life, size, color, kind) {
    const p = this._alloc(kind);
    if (!p) return null;
    p.init(x, y, vx, vy, life, size, color);
    p.kind = kind;
    if (kind === 'trail') p.alpha = CONFIG.FX.TRAIL.ALPHA;
    if (kind === 'ambient') p.alpha = 0.22;
    return p;
  }

  flush() {                            // Game 帧末调用：队列 → 发射
    this.lastEmitted = this.queue.map((ev) => ({ ...ev }));   // v3.1：联机广播源（HostRoom 逐帧读取，浅拷贝防引用逃逸）
    for (const ev of this.queue) this.emit(ev);
    this.queue.length = 0;
  }

  update(dt) {
    for (const p of this.pool) {
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; if (p.kind === 'ambient') this.ambientAlive--; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p._home) {                   // v4.0 锤蓄力汇聚粒子：随寿命向球心收敛（位置 = home + 偏移×剩余比）
        const remain = Math.max(0, p.life / p.maxLife);
        p.x = p._home.x + p._off.x * remain;
        p.y = p._home.y + p._off.y * remain;
      }
    }
    for (let i = this.afterimages.length - 1; i >= 0; i--) {
      this.afterimages[i].life -= dt;
      if (this.afterimages[i].life <= 0) this.afterimages.splice(i, 1);
    }
    for (let i = this.arcs.length - 1; i >= 0; i--) {
      this.arcs[i].life -= dt;
      if (this.arcs[i].life <= 0) this.arcs.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      this.rings[i].life -= dt;
      if (this.rings[i].life <= 0) this.rings.splice(i, 1);
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * (CONFIG.SHAKE.DEATH / CONFIG.SHAKE.DECAY));
  }

  render(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';        // 加法混合
    for (const p of this.pool) {
      if (!p.alive) continue;
      const a = (p.alpha !== undefined ? p.alpha : 1) * (p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.kind === 'ghost' ? 1 : p.life / p.maxLife + 0.3), 0, Math.PI * 2);
      ctx.fill();
    }
    // v4.0 挥刀残影：球体轮廓快照，alpha 0.4/0.25 → 200ms 内整体渐隐
    for (const a of this.afterimages) {
      ctx.globalAlpha = a.alpha * (a.life / a.maxLife);
      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // v4.0 宽月牙刃光 / 锤击弧光：扇形弧段（双层=宽晕+亮芯）
    for (const arc of this.arcs) {
      const k = arc.life / arc.maxLife;
      const a0 = arc.ang - Math.PI / 2.2, a1 = arc.ang + Math.PI / 2.2;   // ≈±82° 张弧
      for (const [w, alpha, col] of arc.glow
             ? [[arc.width * 2.2, 0.35 * k, arc.color], [arc.width, k, '#fff']]
             : [[arc.width, k, arc.color]]) {
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = col;
        ctx.lineWidth = w * (0.5 + 0.5 * k);
        ctx.beginPath();
        ctx.arc(arc.x, arc.y, arc.radius, a0, a1);
        ctx.stroke();
      }
    }
    // 冲击环 r0→r1（死亡爆裂 / 秒杀双层环 / 弹开双环 / 锤落点共用通道）
    for (const ring of this.rings) {
      const k = 1 - ring.life / ring.maxLife;
      ctx.globalAlpha = ring.life / ring.maxLife;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, lerp(ring.r0, ring.r1, k), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();                                   // 控制 #9：用完还原
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
 * §8 Audio —— Web Audio 振荡器合成（无资产，首次交互后 lazy init）
 * ============================================================ */
class AudioBus {
  constructor() { this.ctx = null; }
  init() {                             // 必须在首次 pointerdown 后调用（控制 #7）
    if (this.ctx) {
      /* v3.0 iOS：切后台/锁屏后 ctx 变 suspended，touchend 解锁通道每次尝试 resume */
      if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
      return;
    }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { this.ctx = null; }
  }
  play(name) {
    if (!this.ctx) return;
    const spec = {
      blade:  { f0: 900, f1: 280, dur: 0.08, type: 'square',  gain: 0.05 },  // v4.0 挥刀
      hammer: { f0: 150, f1: 60,  dur: 0.30, type: 'sawtooth',gain: 0.09 },  // v4.0 落锤
      death:  { f0: 200, f1: 40,  dur: 0.45, type: 'sawtooth',gain: 0.09 },
      banner: { f0: 90,  f1: 70,  dur: 0.60, type: 'sine',    gain: 0.10 },  // 低频音
      deny:   { f0: 140, f1: 120, dur: 0.08, type: 'square',  gain: 0.04 },
    }[name];
    if (!spec) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = spec.type;
    osc.frequency.setValueAtTime(spec.f0, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, spec.f1), t0 + spec.dur);
    g.gain.setValueAtTime(spec.gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + spec.dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + spec.dur);
  }
}

/* ============================================================
 * §9 Progression & GhostStore —— 计数阈值 / 本地存储（v2.0）
 * 控制 #16：本地池计数逻辑与服务端语义同构（同一套阈值函数，二期复用）
 * 计数语义唯一真源：progression.md §2（defeatedPlayers / challengedSuccess / everBeaten）
 * ============================================================ */

/* 条目阈值裁决（纯函数；本地与服务端 /report 共用同一语义） */
function selfOutcome(counters) {
  return counters.defeatedPlayers >= CONFIG.THRESHOLDS.SELF_PROMOTE ? 'promote' : 'stay';
}
function bossSoloOutcome(counters) {
  return counters.challengedSuccess >= CONFIG.THRESHOLDS.BOSS_SOLO_DELETE ? 'delete' : 'stay';
}

/* —— 业务进展应用（GameScreen 与单测共用；remote 模式二期换 /report，语义不变） —— */

/* 挑战自我·胜利：当前关替换为胜利 replay（新幽灵计数归零）+ 第 N+1 关占位 */
function onSelfWin(store, level, victoryReplay) {
  const entry = store.list('self')[level - 1];
  if (!entry) return { nextLevel: null };
  store.replace('self', entry.id, victoryReplay);
  const next = level + 1;
  if (store.list('self').length < next) store.put('self', victoryReplay, {});   // 占位规则
  if (next > store.getProgress('self').unlockedLevel) store.setUnlocked('self', next);
  store.incProgress('self', 1);
  store.incWin('self');
  return { nextLevel: next };
}

/* 挑战自我·失败：entry.defeatedPlayers +1；达 20 → 晋级单机boss + 受害者 replay 顶替槽位 */
function onSelfLose(store, level, victimReplay) {
  const entry = store.list('self')[level - 1];
  if (!entry) return { promoted: false, defeated: 0, bossLevel: null };
  entry.counters.defeatedPlayers += 1;
  const defeated = entry.counters.defeatedPlayers;
  let promoted = false, bossLevel = null;
  if (selfOutcome(entry.counters) === 'promote') {
    bossLevel = store.list('boss_solo').length + 1;      // 追加为单机boss最新关
    store.put('boss_solo', deserializeReplay(entry.payload), {});
    store.replace('self', entry.id, victimReplay);       // 槽位由第 20 个受害者顶替（非清空）
    promoted = true;
  }
  store.incLoss('self');
  store.persist('self');
  return { promoted, defeated, bossLevel };
}

/* 单机boss·胜利：challengedSuccess +1；达 20 → 删除，后续关顺位前移（计数随条目走） */
function onBossSoloWin(store, level) {
  const entries = store.list('boss_solo');
  const entry = entries[level - 1];
  if (!entry) return { deleted: false, poolEmpty: true, nextLevel: null, challenged: 0 };
  entry.counters.challengedSuccess += 1;
  const challenged = entry.counters.challengedSuccess;
  let deleted = false;
  if (bossSoloOutcome(entry.counters) === 'delete') {
    store.remove('boss_solo', entry.id);
    deleted = true;
  }
  store.incProgress('boss_solo', 1);
  store.incWin('boss_solo');
  store.persist('boss_solo');
  const remaining = store.list('boss_solo').length;
  const nextLevel = deleted ? (level <= remaining ? level : null)     // 顺位前移：原 K+1 变 K
                            : (level + 1 <= entries.length ? level + 1 : null);
  return { deleted, poolEmpty: remaining === 0, nextLevel, challenged };
}

/* 单机boss·失败：defeatedPlayers +1（仅计数，无上限） */
function onBossSoloLose(store, level) {
  const entry = store.list('boss_solo')[level - 1];
  if (entry) entry.counters.defeatedPlayers += 1;
  store.incLoss('boss_solo');
  store.persist('boss_solo');
  return { defeated: entry ? entry.counters.defeatedPlayers : 0 };
}

/* v2.1 播种（level-flow.md v2.1 §B）：仅第 2 关胜利 replay 播种挑战自我第 1 关。
 * v3.0：联机池播种随联机三池作废而删除（seedRemote no-op 移除）。 */
function seedOnLevelWin(store, levelN, winReplay) {
  if (levelN !== 2) return false;
  if (store.list('self').length === 0) {
    store.put('self', winReplay, {});
    return true;
  }
  return false;
}

/* 灰显判定（menu.md v3.0：五项 IA——AI 菜单项随用户指令删除，OrbAI 保留为控制台 API；
 * 联机对战可点进入骨架屏（配对联机开发中）；单机boss 池空灰） */
function isModeAvailable(mode, store) {
  if (mode === 'solo' || mode === 'self' || mode === 'online' || mode === 'quit') return true;
  if (mode === 'boss_solo') return store.list('boss_solo').length > 0;
  return false;
}

/* HUD 文案（menu.md 原文逐字；v3.0 联机三池文案随模式删除） */
function hudLines(mode, counters) {
  const c = counters || { defeatedPlayers: 0, challengedSuccess: 0 };
  switch (mode) {
    case 'boss_solo':   return ['被挑战成功数：' + c.challengedSuccess + '/20', '已打败玩家数：' + c.defeatedPlayers];
    case 'self':        return ['已打败玩家数：' + c.defeatedPlayers + '/20'];
    default:            return [];
  }
}

/* GhostStore 双实现同接口（ADR-006）：list/pickRandom/put/replace/remove/incProgress/getProgress
 * 本地实现：localStorage 键前缀 'gd.<mode>.'（条目结构 modes.md §8.4），QuotaExceeded 淘汰护栏 */
class LocalGhostStore {
  constructor() {
    this.mem = {};                      // localStorage 不可用（隐私模式）→ 内存态降级
    this.ls = null;
    try {
      const probe = 'gd.__probe';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      this.ls = window.localStorage;
    } catch (e) { this.ls = null; }
    this.persistent = !!this.ls;
    this.cache = {};                    // 常驻内存工作副本（list 返回活对象，业务可直接改计数）
  }
  _key(mode) { return 'gd.' + mode + '.data'; }
  _empty() { return { entries: [], unlockedLevel: 1, progress: 0, wins: 0, losses: 0 }; }
  _load(mode) {
    if (this.cache[mode]) return this.cache[mode];
    let data = this._empty();
    try {
      const raw = this.ls ? this.ls.getItem(this._key(mode)) : this.mem[this._key(mode)];
      if (raw) data = JSON.parse(raw);
    } catch (e) { data = this._empty(); }
    this.cache[mode] = data;
    return data;
  }
  _save(mode) {
    const raw = JSON.stringify(this.cache[mode]);
    try {
      if (this.ls) this.ls.setItem(this._key(mode), raw);
      else this.mem[this._key(mode)] = raw;
    } catch (e) {
      // QuotaExceededError：按 uploadedAt 淘汰最旧条目后重试（架构 §2 容量护栏）
      const data = this.cache[mode];
      if (data.entries.length > 0) {
        data.entries.sort((a, b) => ((a.meta && a.meta.uploadedAt) || 0) - ((b.meta && b.meta.uploadedAt) || 0));
        const dropped = data.entries.shift();
        console.warn('[GhostStore] quota exceeded, evicted oldest:', dropped && dropped.id);
        this._save(mode);
      }
    }
  }
  _counters(mode) {
    return mode === 'self' ? { defeatedPlayers: 0 }
         : mode === 'boss_solo' ? { challengedSuccess: 0, defeatedPlayers: 0 }
         : { defeatedPlayers: 0, challengedSuccess: 0 };
  }
  list(mode) { return this._load(mode).entries; }
  pickRandom(mode) {
    const es = this.list(mode);
    if (es.length === 0) return null;
    const e = es[Math.floor(Math.random() * es.length)];
    return { id: e.id, replay: deserializeReplay(e.payload) };
  }
  put(mode, replay, meta) {
    const data = this._load(mode);
    const id = 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    data.entries.push({
      id,
      payload: serializeReplay(replay),
      meta: { duration: replay.duration || 0, uploadedAt: Date.now(), ...(meta || {}) },
      counters: this._counters(mode),
    });
    this._save(mode);
    return id;
  }
  replace(mode, id, replay) {
    const data = this._load(mode);
    const e = data.entries.find((x) => x.id === id);
    if (!e) return { ok: false, stale: true };        // CAS 语义预留：远程实现映射 stale 分支
    e.payload = serializeReplay(replay);
    e.meta = { duration: replay.duration || 0, uploadedAt: Date.now() };
    e.counters = this._counters(mode);                // 新幽灵从 0 计（modes.md §5）
    this._save(mode);
    return { ok: true, stale: false };
  }
  remove(mode, id) {
    const data = this._load(mode);
    data.entries = data.entries.filter((x) => x.id !== id);
    this._save(mode);
  }
  incProgress(mode, delta) {
    const d = this._load(mode);
    d.progress += delta;
    this._save(mode);
    return d.progress;
  }
  getProgress(mode) {
    const d = this._load(mode);
    return { progress: d.progress, wins: d.wins, losses: d.losses, unlockedLevel: d.unlockedLevel || 1 };
  }
  /* —— 本地扩展（wins/losses/unlockedLevel 落盘；remote 侧由 /report 原子承担） —— */
  incWin(mode) { this._load(mode).wins += 1; this._save(mode); }
  incLoss(mode) { this._load(mode).losses += 1; this._save(mode); }
  setUnlocked(mode, lv) { this._load(mode).unlockedLevel = lv; this._save(mode); }
  persist(mode) { this._save(mode); }   // Progression 直改内存计数后落盘
}


/* ============================================================
 * §9.5 OrbAI —— AI 输入管道（ADR-009：AI 输入与人类同通路）
 * ai-interface.md v4.0：Input 结构 blade/hammer（{x,y}=虚拟光标=准星来源）；
 * think() 消费冻结快照（Match.snapshotView），异常降级空输入不判负。
 * ============================================================ */
/* ---------- AIInput：每 tick 首先被 beginTick 喂入世界快照，决策缓存供本帧消费 ---------- */
class AIInput {
  /* impl: {name, think(state)}；seat: 'P1'|'P2'（快照视角） */
  constructor(impl, seat) {
    this.impl = impl; this.seat = seat;
    this._dec = { move: { x: 0, y: 0 }, blade: false, hammer: false };
    this._bladeConsumed = false; this._hammerConsumed = false;
  }
  /* Match.update 顶部调用（逻辑更新前 = 上一帧末世界状态；本 tick 输入消费前就绪） */
  beginTick(match) {
    this._bladeConsumed = false; this._hammerConsumed = false;
    try {
      const snap = match.snapshotView(this.seat);
      const d = this.impl.think(snap);
      /* v4.0：blade/hammer = true | {x,y} | null（坐标即虚拟光标，与桌面鼠标同坐标管线）；
       * 旧字段 click0/guardHeld/chargeHeld 不识别，传入被忽略（协议 v2 无跨版本兼容） */
      this._dec = {
        move: d && d.move ? { x: d.move.x || 0, y: d.move.y || 0 } : { x: 0, y: 0 },
        blade: (d && d.blade) ? d.blade : false,
        hammer: (d && d.hammer) ? d.hammer : false,
      };
    } catch (err) {
      /* ADR-009：AI 异常 = 空输入 + 控制台告警，不判负不崩局 */
      console.warn('[OrbAI] ' + (this.impl.name || 'ai') + ' think() 异常，本帧空输入：', err);
      this._dec = { move: { x: 0, y: 0 }, blade: false, hammer: false };
    }
  }
  getMoveAxis() { return this._dec.move; }
  /* 准星方向 = 决策中的虚拟光标坐标 − 球心（getAim 同人类鼠标管线）；无坐标 → 零向量交给 Player 兜底 */
  getAim(pos) {
    const c = this._dec.blade || this._dec.hammer;
    if (c && c !== true && pos) return norm(c.x - pos.x, c.y - pos.y);
    return { x: 0, y: 0 };
  }
  consumeBlade() {                      // 帧内一次消费（同帧重复请求无效）
    if (this._bladeConsumed) return false;
    this._bladeConsumed = true;
    return !!this._dec.blade;
  }
  consumeHammer() {
    if (this._hammerConsumed) return false;
    this._hammerConsumed = true;
    return !!this._dec.hammer;
  }
  isDown() { return false; }            // AI 无按键语义（KeyR 等仅人类）
  endFrame() {}                         // no-op（blade/hammer 生命周期由 beginTick 重置）
}

/* ---------- 内置示例 AI v4.0：默认追击+刀连击；对手锤起手时切向绕后（harness 自定，策略不作硬性验收） ---------- */
function createBuiltinAI() {
  let weaveSide = 1;
  return {
    name: '内置示例',
    think(state) {
      const dx = state.opp.x - state.self.x, dy = state.opp.y - state.self.y;
      const dist = Math.hypot(dx, dy);
      let move;
      if (state.opp.phase === 'hammer_windup' || state.opp.phase === 'hammer_active') {
        // 锤起手/判定 → 切向绕后（躲锤区 96px/±30° 扇形，重定向一次保持连贯）
        const px = -dy / (dist || 1), py = dx / (dist || 1);
        move = { x: px * weaveSide, y: py * weaveSide };
      } else {
        if (state.opp.phase === 'blade_windup' || state.opp.phase === 'hammer_windup') weaveSide = -weaveSide;
        move = dist > 1 ? { x: dx / dist, y: dy / dist } : { x: 0, y: 0 };
      }
      // 刀连击：距离 < 170（刃区 128 + 本体 64 内可及）且自身冷却完毕 → 虚拟光标=对手位置
      const blade = (dist < 170 && state.self.bladeCooldown <= 0 && state.opp.phase !== 'dead')
                    ? { x: state.opp.x, y: state.opp.y } : false;
      return { move, blade, hammer: false };   // 内置 AI 不赌锤（高风险，策略保持稳健）
    },
  };
}

/* ---------- 用户 AI 代码编译：new Function 包装 + think 校验（window.OrbAI 'code' spec 用） ---------- */
function compileAICode(code) {
  let obj;
  try {
    obj = new Function('return (' + code + ')')();
  } catch (err) {
    throw new Error('AI 代码语法错误：' + err.message);
  }
  if (!obj || typeof obj.think !== 'function') {
    throw new Error('AI 代码必须提供 think(state) 函数');
  }
  return obj;
}

/* ============================================================
 * §10 Match —— 对局（原 Game 对局部分降级，由 GameScreen 持有；
 * 屏幕层在外、对局层在内，架构 v2.0 §1）
 * ============================================================ */
class Match {
  /* deps: {input, fx, audio}
   * cfg: {mode, opp:'dummy'|'ghost'|'pvp', replay?, onEnd(result, replay, seconds),
   *       onLevelWin(levelN, winReplay),
   *       p1Input?, p2Input?, timeLimit?}   ← v3.0：输入源注入（无头化 §1.3）+ demo 对局时限 */
  constructor(deps, cfg) {
    this.input = deps.input; this.fx = deps.fx; this.audio = deps.audio;
    this.mode = cfg.mode;
    this.opp = cfg.opp;
    this.cfgReplay = cfg.replay || null;     // 非 solo 模式的幽灵 replay（来自 store）
    this.onEnd = cfg.onEnd || (() => {});
    this.onLevelWin = cfg.onLevelWin || (() => {});
    /* v3.0 无头化：输入源注入（人类 Input / AIInput 同通路，ADR-009）。
     * demo 形态：P1/P2 各持输入源；单机形态：P1 = deps.input */
    this.p1Input = cfg.p1Input || deps.input;
    this.p2Input = cfg.p2Input || this.p1Input;
    this.timeLimit = cfg.timeLimit || 300;   // demo 单局上限 5 分钟（ai-interface.md §6.2）
    this.ended = false;

    this.player = null; this.p2 = null; this.dummy = null; this.ghost = null;
    this.mirrorReplay = null;          // 第 1 关（教学）录制段 → 第 2 关幽灵来源
    this.lastWinReplay = null;         // v2.1 无限链：第 N 关胜利段 → 第 N+1 关幽灵（N≥2）
    this.recorder = new Recorder();    // Recorder 全局化：按对局尝试分段，仅胜利段作幽灵源
    this.camera = new CameraSystem();  // v4.1 特写镜头：仅渲染层 + timeScale 慢放（fx.md v4.1 §B）
    /* v2.3 镜像复刻：offset = 幽灵出生点 − 镜像后玩家出生点（CONFIG 推导，勿硬编码；
     * 镜像变换 x'=1280−x 已把玩家轨迹映射到幽灵侧，推导结果 = (0,0)） */
    this.offset = {
      x: CONFIG.SPAWN.GHOST.x - (CONFIG.VIEW.W - CONFIG.SPAWN.PLAYER.x),
      y: CONFIG.SPAWN.GHOST.y - CONFIG.SPAWN.PLAYER.y,
    };

    this.levelN = 1;                   // v2.1 无限关卡链：当前第 N 关
    this.level = 'PLAY';               // PLAY / AUTO_ADVANCE / DEATH / VICTORY / DRAW(dormant)
    this.bannerTimer = 0;              // AUTO_ADVANCE 与 DRAW 共用通道
    this.hitstopTimer = 0;
    this.slowTimer = 0;                // 死亡慢放
    this.tick = 0;                     // 对局内相对 tick（0-based，进屏清零，控制 #11）
    this.matchTime = 0;                // 本关用时（秒）
    this._endTimer = 0;                // VICTORY 定格 → finish（self/boss 单关结算）
    this.prevR = false;
    this._prevPhaseP = CombatState.IDLE; this._prevPhaseG = CombatState.IDLE;
    this._hpFlashP = 0; this._hpFlashG = 0;   // 血条熄灭格闪红 150ms
    this._hitFlashP = 0; this._hitFlashG = 0; // 受击白闪 80ms / 对撞白闪 60ms
    this.start();
  }

  /* ---------- 状态迁移 ---------- */
  start() {
    if (this.mode === 'demo') { this.enterDemo(); return; }   // v3.0：PVP 对局（零 Recorder/GhostPlayer）
    this.recorder.begin();             // 对局开始即录制（按尝试分段）
    this.enterLevel(1);
  }
  /* v3.0 demo 对局（人机 / AI-vs-AI 演示 / 二期联机权威模拟同形态）：
   * P1 (230,360) vs P2 (1050,360)，固定站位，无幽灵无录制（modes.md v3.0 §A） */
  enterDemo() {
    this.player = new Player(CONFIG.SPAWN.PLAYER.x, CONFIG.SPAWN.PLAYER.y);
    this.p2 = new Player(CONFIG.SPAWN.GHOST.x, CONFIG.SPAWN.GHOST.y);
    this.player.combat.onAction = (type, ang) => this.audio.play(type);   // v4.0：blade/hammer 音效名直映
    this.p2.combat.onAction = (type, ang) => this.audio.play(type);
    this.dummy = null; this.ghost = null;
    this.recorder.reset();             // demo 不录制（recording 未 begin，sample/recordAction no-op）
    this.tick = 0; this.matchTime = 0;
    this.hitstopTimer = this.slowTimer = this._endTimer = 0;
    this._hpFlashP = this._hpFlashG = this._hitFlashP = this._hitFlashG = 0;
    this._prevPhaseP = this._prevPhaseG = CombatState.IDLE;
    this.level = 'PLAY';
  }
  /* 动作录制+播音统一绑定（t = recorder.tickCount，段内单调、与轨迹帧严格对齐；
   * enterLevel 重建 Player 后必须重绑，否则漏录） */
  _bindPlayerAction(player) {
    player.combat.onAction = (type, ang) => {
      // 控制 #11：事件 t 与轨迹帧同源——取 Recorder 自身帧计数（sample 前即当前待写帧号）
      this.recorder.recordAction(type, ang, this.recorder.tickCount);
      this.audio.play(type);           // v4.0：'blade' / 'hammer'（Recorder 事件类型 = 音效名）
    };
  }
  /* v2.1 无限关卡链 + v2.2 固定站位：进入第 n 关（1=教学木桩，≥2=镜像幽灵）。
   * 每次尝试（进入/重试）为新录制段：recorder.reset() 丢弃上段；幽灵数据不变（重打同源）。
   * 幽灵来源（ServeProvider 泛化，无新接口）：
   *   solo 第 2 关 = 教学段录制；solo 第 3 关起 = 上一关胜利段；非 solo = cfgReplay */
  enterLevel(n) {
    this.levelN = n;
    this.player = new Player(CONFIG.SPAWN.PLAYER.x, CONFIG.SPAWN.PLAYER.y);   // 恒 (230,360)
    this._bindPlayerAction(this.player);
    this.dummy = null; this.ghost = null;
    let replay = null;
    if (this.opp === 'dummy') {
      if (n === 1) {
        this.dummy = new Dummy(CONFIG.SPAWN.DUMMY.x, CONFIG.SPAWN.DUMMY.y);   // 木桩 (1050,360) HP=3
      } else {
        replay = (n === 2) ? this.mirrorReplay : this.lastWinReplay;
      }
    } else {
      replay = this.cfgReplay;
    }
    if (replay) this.ghost = new GhostPlayer(replay, this.offset.x, this.offset.y);
    this.recorder.reset();             // 新尝试段从帧 0 起录（失败段/上关段不混入）
    this.tick = 0;                     // 回放 tick 轴归零（与录制段同长度）
    this.matchTime = 0;
    this.hitstopTimer = this.slowTimer = this._endTimer = 0;
    this._hpFlashP = this._hpFlashG = this._hitFlashP = this._hitFlashG = 0;
    this._prevPhaseP = this._prevPhaseG = CombatState.IDLE;
    this.level = 'PLAY';
  }

  /* ---------- 命中判定：HitResolver 三步原子裁决（控制 #10/#15）+ v2.2 命中矩阵 ---------- */
  /* ---------- 命中判定：HitResolver 三步原子裁决（控制 #10/#15）+ v4.0 命中矩阵（attack.md §5） ---------- */
  resolveHits() {
    if (this.opp === 'dummy' && this.levelN === 1) {   // 第 1 关木桩（HP=3：三刀击杀 / 一锤秒杀）
      const r = checkAttackHit(this.player, this.dummy);
      if (r) {
        this.player.combat._hitVictims.add(this.dummy);
        this.fx.queue.push({ type: 'camera', tier: 1, x: this.dummy.x, y: this.dummy.y });   // v4.1 有效命中 = T1
        if (r === 'hammer') {                        // 锤秒杀：无视 HP 直接击碎
          this.dummy.combat.kill();
          this._emitKillBurst(this.dummy, CONFIG.COLOR.GHOST);
          this._onOpponentDead(this.dummy, this.levelN);   // → AUTO_ADVANCE
        } else {
          const res = this.dummy.combat.hit();       // 刀：−1 HP，归 0 才死
          if (res === 'dead') {
            this._emitKillBurst(this.dummy, CONFIG.COLOR.GHOST);   // HP 归 0 同秒杀视觉（爆裂）
            this._onOpponentDead(this.dummy, this.levelN);
          } else this._onNonLethalHit(this.dummy, 'G');
        }
      }
      return;
    }
    // v3.0 demo：P2（Player 实体）承载 ghost 变量位，复用对称裁决
    const g = this.ghost || this.p2;
    if (!g) return;
    const p = this.player;

    // Step1 收集（只读，对称顺序，不产生副作用；defPhase = 帧首相位，v4.1 D.1）
    const events = [];
    const r1 = checkAttackHit(p, g);
    if (r1) events.push({ attacker: p, defender: g, kind: r1, defPhase: g._fsPhase });
    const r2 = checkAttackHit(g, p);
    if (r2) events.push({ attacker: g, defender: p, kind: r2, defPhase: p._fsPhase });

    // Step2 裁决（本步内原子完成，禁止跨帧分判；§5.3 顺序①→②→③在 adjudicate 内实现）
    const verdict = adjudicate(events);
    if (verdict.type === 'none') return;

    // Step3 分配：先写相位，后推 fx（控制 #10：副作用不得先行）
    if (verdict.type === 'stagger') {              // ① 刀刀弹开：双方不掉血，各 300ms
      const a = verdict.a, b = verdict.b;
      const dx = b.x - a.x, dy = b.y - a.y;
      const L = len(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      a.combat.stagger({ x: -ux, y: -uy });        // 沿连线互相弹开（弹开含碰撞分离）
      b.combat.stagger({ x: ux, y: uy });
      this.fx.queue.push({ type: 'clash_ring', x: a.x, y: a.y });
      this.fx.queue.push({ type: 'clash_ring', x: b.x, y: b.y });
      this._hitFlashP = Math.max(this._hitFlashP, CONFIG.CLASH.FLASH);   // 双方白闪 60ms
      this._hitFlashG = Math.max(this._hitFlashG, CONFIG.CLASH.FLASH);
      this.fx.shake = Math.max(this.fx.shake, CONFIG.SHAKE.COLLIDE);
      /* 刀刀弹开不触发特写（attack.md v4.1 A：维持节奏） */
    } else if (verdict.type === 'break_kill') {    // v4.1 ②.5 碎刃秒杀（T3）：刀方无视 HP 与刃区保护
      verdict.loser.combat.kill();
      this.fx.queue.push({ type: 'blade_shatter', x: verdict.loser.x, y: verdict.loser.y, ang: verdict.loser.facing });
      this.fx.queue.push({ type: 'camera', tier: 3, x: verdict.loser.x, y: verdict.loser.y });
      this._onEntityDead(verdict.loser, p, true);   // 秒杀爆裂 + KILL_HITSTOP（demo → endDemo）
    } else if (verdict.type === 'draw_kill') {     // ② 锤锤互中 → 双方同时秒杀 → DRAW 复活
      verdict.a.combat.kill();
      verdict.b.combat.kill();
      this._emitKillBurst(verdict.a, CONFIG.COLOR.PLAYER);
      this._emitKillBurst(verdict.b, CONFIG.COLOR.GHOST);
      this.fx.queue.push({ type: 'camera', tier: 1,          // v4.1：普通秒杀档（锚点取两球中点）
                           x: (verdict.a.x + verdict.b.x) / 2, y: (verdict.a.y + verdict.b.y) / 2 });
      this.audio.play('death');
      this.hitstopTimer = Math.max(this.hitstopTimer, CONFIG.HITSTOP);   // DRAW 复活 120ms hitstop
      this.level = 'DRAW';                        // 120ms hitstop + 600ms「同归于尽」横幅 + 自动重开
      this.bannerTimer = CONFIG.BANNER.DRAW_DUR;
      this.recorder.reset();                      // DRAW = 无效对局：不产 replay、不计任何数（modes.md §3）
    } else if (verdict.type === 'list') {          // ③ 逐点结算（刀+锤混合事件，按收集顺序）
      for (const v of verdict.list) {
        if (v.type === 'hit') {                    // 刀有效命中：目标 −1 HP
          const loser = v.loser, winner = v.winner;
          winner.combat._hitVictims.add(loser);
          const res = loser.combat.hit();
          this.fx.queue.push({ type: 'camera', tier: 1, x: loser.x, y: loser.y });   // v4.1 有效命中 = T1
          if (res === 'dead') this._onEntityDead(loser, p, false);
          else {
            this._onNonLethalHit(loser, loser === p ? 'P' : 'G');
            this.fx.queue.push({ type: 'burst', x: loser.x, y: loser.y,
                                 color: loser === p ? CONFIG.COLOR.PLAYER : CONFIG.COLOR.GHOST,
                                 shake: 0, kill: false, small: true });   // 命中火花（小爆裂、零震屏）
          }
        } else if (v.type === 'interrupt') {       // v4.1 打断挥锤（T2）：−1 HP + 锤相位取消回 IDLE + 冷却不启动
          const loser = v.loser, winner = v.winner;
          winner.combat._hitVictims.add(loser);
          const res = loser.combat.hit();
          if (res === 'dead') {                    // 打断致死：按普通死亡收束（T1 已在 hit 通道？此处补 T1）
            this.fx.queue.push({ type: 'camera', tier: 1, x: loser.x, y: loser.y });
            this._onEntityDead(loser, p, false);
          } else {
            this._onNonLethalHit(loser, loser === p ? 'P' : 'G');
            loser.combat.phase = CombatState.IDLE;     // 锤相位取消（含判定帧迁移场景：帧首 windup 判打断）
            loser.combat.t = 0;
            loser.combat.hammerCooldown = 0;           // 未完成出招不算出招（attack.md v4.1 C.2）
            this.fx.queue.push({ type: 'interrupt_fx', x: loser.x, y: loser.y, ang: loser.facing });
            this.fx.queue.push({ type: 'camera', tier: 2, x: loser.x, y: loser.y });
          }
        } else if (v.type === 'kill') {            // 锤秒杀（刃区外，普通）：无视 HP 直接进死亡流程
          v.loser.combat.kill();
          v.winner.combat._hitVictims.add(v.loser);
          this.fx.queue.push({ type: 'camera', tier: 1, x: v.loser.x, y: v.loser.y });   // v4.1 = T1
          this._onEntityDead(v.loser, p, true);
        } else {                                   // ineffective：刃区格挡（仅刀，v4.1），光弧提前消散
          v.attacker.combat._hitVictims.add(v.defender);
          this.fx.queue.push({ type: 'blade_swing', x: v.attacker.x, y: v.attacker.y,
                               ang: v.attacker.facing, color: '#fff', fade: true });
        }
      }
    }
  }

  /* 实体死亡分派（demo 收束 / 玩家 DEATH / 对手 DEAD 通道）；hammer=true 时秒杀升级特效 */
  _onEntityDead(loser, p, hammer) {
    const isPlayer = loser === p;
    if (this.mode === 'demo') {                  // v3.0：demo 击杀 → 对局结束（无关卡链）
      this.endDemo(isPlayer ? 'P2' : 'P1', loser);
      return;
    }
    this.fx.queue.push({ type: 'burst', x: loser.x, y: loser.y, kill: !!hammer,
                         color: isPlayer ? CONFIG.COLOR.PLAYER : CONFIG.COLOR.GHOST });
    this.audio.play('death');
    this.hitstopTimer = Math.max(this.hitstopTimer, hammer ? CONFIG.KILL_HITSTOP : CONFIG.HITSTOP);
    if (isPlayer) {
      this.slowTimer = CONFIG.DEATH_SLOW.DUR;    // 死亡慢放 1.0s @0.3
      this.level = 'DEATH';
    } else {
      this._onOpponentDead(loser, this.levelN);  // solo → AUTO_ADVANCE；self/boss → VICTORY
    }
  }

  /* 秒杀/击杀爆裂升级：24 粒 + 双层冲击环 + 200ms hitstop（普通死亡 120ms 不变） */
  _emitKillBurst(ent, color) {
    this.fx.queue.push({ type: 'burst', x: ent.x, y: ent.y, kill: true, color });
    this.hitstopTimer = Math.max(this.hitstopTimer, CONFIG.KILL_HITSTOP);
  }

  /* 对手 HP 归 0：solo 无限链 → AUTO_ADVANCE（仅第 2 关胜利段播种）；self/boss → VICTORY 结算 */
  _onOpponentDead(opponent, levelN) {
    if (this.mode === 'solo') {
      const winReplay = this.recorder.snapshot();  // 本关胜利段（尝试段闭合快照）
      if (levelN === 1) this.mirrorReplay = winReplay;    // 教学段 → 第 2 关幽灵
      else this.lastWinReplay = winReplay;                // 第 N 关胜利段 → 第 N+1 关幽灵
      this.onLevelWin(levelN, winReplay);          // 播种通道（GameScreen 仅消费第 2 关）
      this.level = 'AUTO_ADVANCE';
      this.bannerTimer = CONFIG.BANNER.ADVANCE_DUR;
    } else {
      this.level = 'VICTORY';
      this._endTimer = CONFIG.VICTORY_DELAY;       // 定格后 → finish('win') → RESULT
    }
    this.audio.play('banner');
  }

  /* 非致死有效命中：受击白闪 80ms + 微震 3px + 血条熄灭格闪红 150ms（fx.md v2.2 §A） */
  _onNonLethalHit(victim, side) {
    this.fx.shake = Math.max(this.fx.shake, CONFIG.SHAKE.HIT);
    if (side === 'P') { this._hitFlashP = Math.max(this._hitFlashP, CONFIG.HIT.FLASH);
                        this._hpFlashP = Math.max(this._hpFlashP, CONFIG.HPBAR.RED_FLASH); }
    else { this._hitFlashG = Math.max(this._hitFlashG, CONFIG.HIT.FLASH);
           this._hpFlashG = Math.max(this._hpFlashG, CONFIG.HPBAR.RED_FLASH); }
  }

  /* ---------- 特效钩子：相位迁移检测（逻辑期只入队；v4.0 刀锤特效） ---------- */
  fxHooks() {
    const trans = (ent, prev, color) => {
      const cur = ent.combat.phase;
      if (prev !== CombatState.BLADE_ACTIVE && cur === CombatState.BLADE_ACTIVE) {
        this.fx.queue.push({ type: 'blade_swing', x: ent.x, y: ent.y, ang: ent.facing, color });
        this.fx.queue.push({ type: 'blade_afterimages', x: ent.x, y: ent.y, ang: ent.facing,
                             r: ent.r, color });   // v4.0 挥刀残影 2 段（起手收缩 85% 描边在 drawBall）
      }
      if (prev !== CombatState.HAMMER_WINDUP && cur === CombatState.HAMMER_WINDUP) {
